[project]
name = "kb"
version = "0.1.0"
description = "Lightweight local-first GraphRAG knowledge base CLI (deterministic; LLM lives in the agent)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "graphrag_knowledge_base" }]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "tomli>=2.0.1; python_version < '3.11'",
    "grafeo>=0.5.42",
]

[project.optional-dependencies]
graph = ["grafeo>=0.5.42"]
embed = ["fastembed>=0.3.0"]
pdf = ["pypdf>=4.0.0"]
math = ["sympy>=1.12"]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "ruff>=0.5.0"]

[project.scripts]
kb = "kb.cli.main:app"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore:.*utcfromtimestamp.*:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    "kb-data",
    ".venv",
    "papers",
]

[tool.ruff.lint]
ignore = [
    "B008",  # Typer argument / option defaults
]
